name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk randyflix.apk

      - uses: actions/upload-artifact@v5
        with:
          name: randyflix-apk
          path: randyflix.apk

      # Keeps a "latest" release with the newest APK attached, so it has a stable download link.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest randyflix.apk \
            --title "RandyFlix build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest
